<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinGuard AI – Real-Time Fraud Detection for Digital Transactions</title>
  <style>
    :root {
      --bg: #070C18;
      --bg-surface: #0E1628;
      --bg-panel: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-cyan: rgba(6, 182, 212, 0.3);
      --primary: #06b6d4;
      --primary-light: #22d3ee;
      --primary-glow: rgba(6, 182, 212, 0.25);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Glass Panels */
    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.12);
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 4px 20px -2px var(--primary-glow);
    }

    /* Typography & Badges */
    .font-mono { font-family: var(--font-mono); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .badge-safe { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-suspicious { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-fraud { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-cyan { background: var(--primary-glow); color: var(--primary-light); border: 1px solid var(--border-cyan); }

    /* Button styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #2563eb 100%);
      color: #050a14;
      font-weight: 700;
      box-shadow: 0 0 16px var(--primary-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* Pulse Glow Animation */
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
      50% { opacity: 0.5; transform: scale(0.95); box-shadow: 0 0 4px rgba(16, 185, 129, 0.2); }
    }
    .animate-pulse-glow { animation: pulseGlow 2s infinite ease-in-out; }

    /* Layout */
    #app-container { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      height: 64px;
      background: rgba(14, 22, 40, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      backdrop-filter: blur(10px);
    }
    .main-body { display: flex; flex: 1; position: relative; }
    aside {
      width: 240px;
      background: rgba(11, 18, 33, 0.95);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 12px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
    }
    main {
      flex: 1;
      padding: 20px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    /* Sidebar Navigation */
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 4px;
      text-align: left;
    }
    .nav-btn:hover { background: rgba(30, 41, 59, 0.6); color: #fff; }
    .nav-btn.active {
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.2) 0%, rgba(37, 99, 235, 0.1) 100%);
      color: var(--primary-light);
      border: 1px solid var(--border-cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.15);
      font-weight: 600;
    }

    /* Form Elements */
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 9px 12px;
      background: #090f1d;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: border 0.15s;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    /* Table styles */
    .tx-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tx-table th {
      text-align: left;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      border-bottom: 1px solid #1e293b;
      background: rgba(14, 22, 40, 0.5);
    }
    .tx-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.6);
      color: #cbd5e1;
    }
    .tx-table tr:hover td { background: rgba(30, 41, 59, 0.35); }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Responsive */
    @media (max-width: 768px) {
      aside {
        position: fixed;
        left: -260px;
        transition: left 0.25s ease;
        z-index: 40;
      }
      aside.open { left: 0; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>

  <div id="app-root"></div>

  <script>
    // --- SAFE CLIENT-SIDE MOCK DATA & PERSISTENCE ---
    const DEFAULT_TRANSACTIONS = [
      { id: 'TX-984210', senderAccount: 'ACCT-4891-US', receiverAccount: 'ACCT-8821-SG', amount: 1420.50, type: 'Bank Transfer', location: 'Frankfurt, Germany', device: 'Desktop (Mac)', ip: '194.26.29.11', time: '14:23:10', score: 18, status: 'Safe', riskLevel: 'Low Risk', reason: 'Standard domestic transfer velocity and recognized user device profile.', timestamp: '2 mins ago' },
      { id: 'TX-984209', senderAccount: 'ACCT-9024-UK', receiverAccount: 'ACCT-1132-NG', amount: 8950.00, type: 'Online Payment', location: 'Lagos, NG', device: 'Mobile (Android)', ip: '102.89.23.144', time: '14:22:45', score: 84, status: 'Fraud', riskLevel: 'High Risk', reason: 'High monetary value ($8,950) exceeds account average; geo-location anomaly detected.', timestamp: '3 mins ago' },
      { id: 'TX-984208', senderAccount: 'ACCT-3312-CA', receiverAccount: 'ACCT-6641-US', amount: 320.00, type: 'Card Payment', location: 'Toronto, Canada', device: 'Mobile (iOS)', ip: '142.250.190.46', time: '14:22:15', score: 12, status: 'Safe', riskLevel: 'Low Risk', reason: 'Verified POS contactless terminal transaction with matching cardholder telemetry.', timestamp: '3 mins ago' },
      { id: 'TX-984207', senderAccount: 'ACCT-7718-DE', receiverAccount: 'ACCT-9921-RU', amount: 5400.00, type: 'Bank Transfer', location: 'Moscow, RU', device: 'Tablet (iPad)', ip: '185.220.101.5', time: '14:21:50', score: 76, status: 'Fraud', riskLevel: 'High Risk', reason: 'Anonymized VPN exit node; international outbound transfer to flagged corridor.', timestamp: '4 mins ago' },
      { id: 'TX-984206', senderAccount: 'ACCT-5531-JP', receiverAccount: 'ACCT-2209-JP', amount: 2150.00, type: 'Online Payment', location: 'Tokyo, Japan', device: 'Desktop (Win)', ip: '133.242.18.99', time: '14:20:12', score: 48, status: 'Suspicious', riskLevel: 'Medium Risk', reason: 'Transaction frequency velocity jump: 4 consecutive transactions in 90 seconds.', timestamp: '5 mins ago' }
    ];

    const DEFAULT_ALERTS = [
      { id: 'ALT-1092', txId: 'TX-984209', amount: 8950.00, riskScore: 84, location: 'Lagos, NG', reason: 'Unusual transaction amount ($8,950), high risk geographic jump, and new device hash.', timestamp: '14:22:45', status: 'Active' },
      { id: 'ALT-1091', txId: 'TX-984207', amount: 5400.00, riskScore: 76, location: 'Moscow, RU', reason: 'Anonymized Tor exit node detected with rapid multi-currency transfer attempt.', timestamp: '14:21:50', status: 'Active' }
    ];

    // --- APPLICATION STATE ---
    let state = {
      user: JSON.parse(localStorage.getItem('finguard_auth') || 'null'),
      activeTab: 'dashboard',
      transactions: JSON.parse(localStorage.getItem('finguard_transactions') || 'null') || DEFAULT_TRANSACTIONS,
      alerts: JSON.parse(localStorage.getItem('finguard_alerts') || 'null') || DEFAULT_ALERTS,
      settings: JSON.parse(localStorage.getItem('finguard_settings') || 'null') || { fraudThreshold: 70, simulationInterval: 2500, audioAlerts: true },
      isSimulating: true,
      searchTerm: '',
      statusFilter: 'All',
      selectedTx: null,
      mobileMenuOpen: false
    };

    function saveState() {
      try {
        localStorage.setItem('finguard_transactions', JSON.stringify(state.transactions.slice(0, 60)));
        localStorage.setItem('finguard_alerts', JSON.stringify(state.alerts.slice(0, 30)));
        localStorage.setItem('finguard_settings', JSON.stringify(state.settings));
      } catch (e) {}
    }

    // Audio chime warning
    function playAudioChime() {
      if (!state.settings.audioAlerts) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    }

    // Heuristic Fraud Scoring Logic
    function evaluateFraudRisk(tx) {
      let score = 5;
      const reasons = [];
      const amount = Number(tx.amount) || 0;
      const location = tx.location || '';
      const freq = tx.transactionFrequency || 'Normal';
      const history = tx.previousFraudHistory || 'None';
      const age = Number(tx.accountAge) || 180;
      const type = tx.transactionType || tx.type || 'Online Payment';

      if (amount > 10000) { score += 42; reasons.push(`High monetary value ($${amount.toLocaleString()}) exceeds normal limits`); }
      else if (amount > 4500) { score += 26; reasons.push(`Transaction amount ($${amount.toLocaleString()}) is 4.5x higher than median`); }
      else if (amount > 1500) { score += 12; reasons.push(`Elevated transaction amount ($${amount.toLocaleString()})`); }

      if (['Lagos, NG', 'Moscow, RU', 'Proxy', 'Unknown'].some(l => location.includes(l))) {
        score += 28; reasons.push(`Geographic IP location (${location}) matches active fraud watchlist`);
      }
      if (freq === 'Extreme Burst') { score += 32; reasons.push('High frequency burst velocity detected (multiple transactions in minutes)'); }
      else if (freq === 'High') { score += 16; reasons.push('Elevated transaction frequency exceeds historical baseline'); }

      if (history === 'Confirmed Flag') { score += 38; reasons.push('Sender identity linked to prior confirmed chargeback'); }
      else if (history === 'Suspected') { score += 18; reasons.push('Account has previous compliance observation flags'); }

      if (age <= 7) { score += 22; reasons.push(`New account creation (${age} days old) showing immediate high velocity`); }

      const finalScore = Math.min(100, Math.max(3, Math.round(score)));
      let status = 'Safe';
      let riskLevel = 'Low Risk';
      let prediction = 'Legitimate Transaction';

      if (finalScore >= 70) {
        status = 'Fraud';
        riskLevel = 'High Risk';
        prediction = 'Potential Fraud / Critical Anomaly';
      } else if (finalScore >= 30) {
        status = 'Suspicious';
        riskLevel = 'Medium Risk';
        prediction = 'Suspicious / Flagged for Review';
      }

      if (reasons.length === 0) {
        reasons.push('Normal user telemetry, recognized device fingerprint, and standard transaction velocity.');
      }

      return {
        score: finalScore,
        status,
        riskLevel,
        prediction,
        reason: reasons.join('; ')
      };
    }

    // Generator for simulated stream
    const CITIES = ['New York, USA', 'London, UK', 'Tokyo, Japan', 'Frankfurt, Germany', 'Lagos, NG', 'Sydney, AU', 'Moscow, RU', 'Singapore', 'Zurich, CH'];
    const DEVICES = ['Mobile (iOS)', 'Mobile (Android)', 'Desktop (Chrome/Mac)', 'Desktop (Windows)', 'Tablet (iPad)'];
    const TYPES = ['Online Payment', 'Bank Transfer', 'ATM Withdrawal', 'Card Payment', 'Mobile Payment'];

    function generateSimulatedTx() {
      const isHigh = Math.random() < 0.22;
      const isMed = !isHigh && Math.random() < 0.28;
      const id = `TX-${Math.floor(100000 + Math.random() * 900000)}`;
      const amount = isHigh ? Math.floor(4500 + Math.random() * 11000) : isMed ? Math.floor(1200 + Math.random() * 3000) : parseFloat((20 + Math.random() * 400).toFixed(2));
      const location = isHigh ? (Math.random() > 0.4 ? 'Lagos, NG' : 'Moscow, RU') : CITIES[Math.floor(Math.random() * CITIES.length)];
      const freq = isHigh ? 'Extreme Burst' : isMed ? 'High' : 'Normal';
      const history = isHigh && Math.random() > 0.5 ? 'Confirmed Flag' : 'None';
      const age = isHigh ? 6 : Math.floor(60 + Math.random() * 400);
      const type = TYPES[Math.floor(Math.random() * TYPES.length)];
      const device = DEVICES[Math.floor(Math.random() * DEVICES.length)];
      const time = new Date().toLocaleTimeString();

      const evalRes = evaluateFraudRisk({ amount, location, transactionFrequency: freq, previousFraudHistory: history, accountAge: age, type });

      return {
        id,
        senderAccount: `ACCT-${Math.floor(1000 + Math.random() * 9000)}-US`,
        receiverAccount: `ACCT-${Math.floor(1000 + Math.random() * 9000)}-SG`,
        amount,
        type,
        location,
        device,
        ip: `${Math.floor(50 + Math.random() * 150)}.${Math.floor(10 + Math.random() * 200)}.${Math.floor(1 + Math.random() * 250)}.1`,
        time,
        score: evalRes.score,
        status: evalRes.status,
        riskLevel: evalRes.riskLevel,
        prediction: evalRes.prediction,
        reason: evalRes.reason,
        timestamp: 'Just now'
      };
    }

    // Simulation loop
    setInterval(() => {
      if (!state.isSimulating || !state.user) return;
      const newTx = generateSimulatedTx();
      state.transactions = [newTx, ...state.transactions.slice(0, 60)];
      const thresh = state.settings.fraudThreshold || 70;
      if (newTx.score >= thresh) {
        playAudioChime();
        state.alerts = [{
          id: `ALT-${Math.floor(1000 + Math.random() * 9000)}`,
          txId: newTx.id,
          amount: newTx.amount,
          riskScore: newTx.score,
          location: newTx.location,
          reason: newTx.reason,
          timestamp: newTx.time,
          status: 'Active'
        }, ...state.alerts.slice(0, 20)];
      }
      saveState();
      renderApp();
    }, state.settings.simulationInterval || 2500);

    // --- UI RENDERING ---
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!state.user) {
        root.innerHTML = renderLogin();
        bindLoginEvents();
        return;
      }
      root.innerHTML = renderDashboard();
      bindDashboardEvents();
      initRadar();
    }

    // Login View
    function renderLogin() {
      return `
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(circle at center, #0e1a33 0%, #070C18 70%);">
          <div class="glass-panel" style="max-width: 420px; width: 100%; padding: 32px; box-shadow: 0 0 40px rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3);">
            <div style="text-align: center; margin-bottom: 24px;">
              <div style="display: inline-flex; padding: 12px; border-radius: 16px; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.4); margin-bottom: 12px;">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
              </div>
              <h1 style="font-size: 26px; font-weight: 800; color: #fff;">FinGuard <span style="color: #06b6d4;">AI</span></h1>
              <p style="font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; margin-top: 4px;">
                Real-Time Fraud Detection for Digital Transactions
              </p>
            </div>

            <div id="login-error" style="display: none; padding: 10px; border-radius: 8px; background: var(--danger-bg); border: 1px solid rgba(239,68,68,0.4); color: #f87171; font-size: 12px; margin-bottom: 16px;"></div>

            <form id="login-form">
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="admin@finguard.ai" required style="font-family: var(--font-mono);">
              </div>

              <div class="form-group">
                <label>Password</label>
                <div style="position: relative;">
                  <input type="password" id="login-pass" class="form-input" placeholder="••••••••" required style="font-family: var(--font-mono); padding-right: 40px;">
                  <button type="button" id="toggle-pass-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 11px;">Show</button>
                </div>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin: 12px 0 16px;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: #cbd5e1;">
                  <input type="checkbox" id="remember-me" checked> Remember Me
                </label>
                <a href="#" id="forgot-pass-link" style="color: #06b6d4; text-decoration: none;">Forgot Password?</a>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">
                Sign In to Console
              </button>

              <div style="text-align: center; margin: 16px 0 12px; font-size: 11px; color: #64748b; font-family: var(--font-mono);">
                ── QUICK ACCESS ──
              </div>

              <button type="button" id="demo-login-btn" class="btn btn-secondary" style="width: 100%; padding: 10px; color: #22d3ee; border-color: rgba(6,182,212,0.4);">
                ⚡ 1-Click Demo Login (admin@finguard.ai)
              </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 11px; color: #64748b;">
              <span class="badge badge-safe">Demo Auth Active (No Server Required)</span>
            </div>
          </div>
        </div>
      `;
    }

    function bindLoginEvents() {
      const form = document.getElementById('login-form');
      const errBox = document.getElementById('login-error');
      const togglePass = document.getElementById('toggle-pass-btn');
      const passInput = document.getElementById('login-pass');
      const demoBtn = document.getElementById('demo-login-btn');
      const forgotLink = document.getElementById('forgot-pass-link');

      togglePass.onclick = () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          togglePass.innerText = 'Hide';
        } else {
          passInput.type = 'password';
          togglePass.innerText = 'Show';
        }
      };

      demoBtn.onclick = () => {
        document.getElementById('login-email').value = 'admin@finguard.ai';
        passInput.value = 'admin123';
        loginUser('admin@finguard.ai');
      };

      forgotLink.onclick = (e) => {
        e.preventDefault();
        alert('Password reset link sent to admin@finguard.ai (Demo Verification Token Generated)');
      };

      form.onsubmit = (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass = passInput.value.trim();

        if (email === 'admin@finguard.ai' && pass === 'admin123') {
          loginUser(email);
        } else {
          errBox.style.display = 'block';
          errBox.innerText = 'Invalid credentials. Use 1-Click Demo Login or admin@finguard.ai / admin123';
        }
      };
    }

    function loginUser(email) {
      state.user = { email, role: 'Chief SecOps Analyst', name: 'Alex Vance' };
      localStorage.setItem('finguard_auth', JSON.stringify(state.user));
      renderApp();
    }

    function logoutUser() {
      state.user = null;
      localStorage.removeItem('finguard_auth');
      renderApp();
    }

    // Dashboard View
    function renderDashboard() {
      const activeAlerts = state.alerts.filter(a => a.status === 'Active');
      return `
        <div id="app-container">
          <!-- Header -->
          <header>
            <div style="display: flex; align-items: center; gap: 12px;">
              <button id="mobile-toggle-btn" class="btn btn-secondary" style="padding: 6px; display: none;" title="Menu">☰</button>

      }

            </div>

            <div class="glass-panel" style="padding: 16px; border-color: rgba(245,158,11,0.3);">

    // TAB 2: LIVE TRANSACTIONS
    function renderLiveTransactionsTab() {
      const filtered = state.transactions.filter(tx => {
        const matchesSearch = tx.id.toLowerCase().includes(state.searchTerm.toLowerCase()) ||
          tx.location.toLowerCase().includes(state.searchTerm.toLowerCase());

    function renderTxTableHtml(list) {
      if (!list || list.length === 0) {
        return '<div style="text-align: center; padding: 32px; color: #64748b;">No transactions match criteria.</div>';
      }
      return `
        <table class="tx-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Location</th>
              <th>Device</th>
              <th>Risk Score</th>
              <th>Status</th>
              <th>Timestamp</th>
              <th style="text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(tx => {
              const badgeClass = tx.status === 'Fraud' ? 'badge-fraud' : tx.status === 'Suspicious' ? 'badge-suspicious' : 'badge-safe';
              const scoreColor = tx.score >= 70 ? '#ef4444' : tx.score >= 30 ? '#f59e0b' : '#10b981';
              return `
                <tr>
                  <td style="font-weight: bold; color: #fff; font-family: var(--font-mono);">${tx.id}</td>
                  <td style="font-family: var(--font-mono); font-weight: 600;">$${Number(tx.amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                  <td>${tx.type}</td>
                  <td>${tx.location}</td>
                  <td style="color: #94a3b8;">${tx.device}</td>
                  <td>
                    <span style="font-family: var(--font-mono); font-weight: bold; color: ${scoreColor};">${tx.score}</span>
                  </td>
                  <td><span class="badge ${badgeClass}">${tx.status}</span></td>
                  <td style="font-size: 11px; color: #94a3b8; font-family: var(--font-mono);">${tx.time || tx.timestamp}</td>
                  <td style="text-align: right;">
                    <button class="btn btn-secondary view-tx-btn" data-id="${tx.id}" style="padding: 4px 8px; font-size: 11px;">View Details</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    // --- EVENT BINDINGS ---
    function bindDashboardEvents() {
      // Logout
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.onclick = logoutUser;

      // Nav Tabs
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          state.activeTab = btn.getAttribute('data-tab');
          renderApp();
        };
      });

      // Simulation Toggle
      const simBtn = document.getElementById('toggle-sim-btn');
      if (simBtn) {
        simBtn.onclick = () => {
          state.isSimulating = !state.isSimulating;
          renderApp();
        };
      }
      const quickSim = document.getElementById('quick-toggle-sim');
      if (quickSim) {
        quickSim.onclick = () => {
          state.isSimulating = !state.isSimulating;
          renderApp();
        };
      }

      // Clear Feed
      const clearBtn = document.getElementById('clear-feed-btn');
      if (clearBtn) {
        clearBtn.onclick = () => {
          state.transactions = [];
          saveState();
          renderApp();
        };
      }

      // Search and Filters
      const searchInput = document.getElementById('search-tx-input');
      if (searchInput) {
        searchInput.oninput = (e) => {
          state.searchTerm = e.target.value;
          renderApp();
        };
      }
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          state.statusFilter = btn.getAttribute('data-filter');
          renderApp();
        };
      });

      // View Tx Modal
      document.querySelectorAll('.view-tx-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          state.selectedTx = state.transactions.find(t => t.id === id);
          renderApp();
        };
      });

      // Alerts Actions
      document.querySelectorAll('.review-alert-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          state.alerts = state.alerts.map(a => a.id === id ? { ...a, status: 'Reviewed' } : a);
          saveState();
          renderApp();
        };
      });
      document.querySelectorAll('.dismiss-alert-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          state.alerts = state.alerts.filter(a => a.id !== id);
          saveState();
          renderApp();
        };
      });
      document.querySelectorAll('.view-alert-tx-btn').forEach(btn => {
        btn.onclick = () => {
          const txId = btn.getAttribute('data-tx');
          const found = state.transactions.find(t => t.id === txId);
          if (found) {
            state.selectedTx = found;
            renderApp();
          } else {
            alert('Transaction archived from memory.');
          }
        };
      });

      // Analyze Form
      const analyzeForm = document.getElementById('analyze-form');
      if (analyzeForm) {
        analyzeForm.onsubmit = (e) => {
          e.preventDefault();
          const amount = document.getElementById('tx-amount').value;
          const loc = document.getElementById('tx-location').value;
          const freq = document.getElementById('tx-frequency').value;
          const hist = document.getElementById('tx-history').value;
          const age = document.getElementById('tx-age').value;
          const type = document.getElementById('tx-type').value;

          const res = evaluateFraudRisk({ amount, location: loc, transactionFrequency: freq, previousFraudHistory: hist, accountAge: age, type });
          const newTx = {
            id: document.getElementById('tx-id').value,
            senderAccount: document.getElementById('tx-sender').value,
            receiverAccount: document.getElementById('tx-receiver').value,
            amount: Number(amount),
            type,
            location: loc,
            device: document.getElementById('tx-device').value,
            ip: document.getElementById('tx-ip').value,
            time: document.getElementById('tx-time').value,
            score: res.score,
            status: res.status,
            riskLevel: res.riskLevel,
            prediction: res.prediction,
            reason: res.reason,
            timestamp: 'Just now'
          };

          state.transactions = [newTx, ...state.transactions];
          if (res.score >= (state.settings.fraudThreshold || 70)) {
            playAudioChime();
            state.alerts = [{
              id: `ALT-${Math.floor(1000 + Math.random() * 9000)}`,
              txId: newTx.id,
              amount: newTx.amount,
              riskScore: newTx.score,
              location: newTx.location,
              reason: newTx.reason,
              timestamp: newTx.time,
              status: 'Active'
            }, ...state.alerts];
          }
          saveState();

          const out = document.getElementById('analysis-output-container');
          if (out) {
            const isF = res.score >= 70;
            const isS = res.score >= 30 && res.score < 70;
            out.innerHTML = `
              <div style="text-align: left;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px;">
                  <span class="badge ${isF ? 'badge-fraud' : isS ? 'badge-suspicious' : 'badge-safe'}">${res.status}</span>
                  <span style="font-size: 10px; color: #06b6d4; font-family: var(--font-mono);">AI Simulation Output</span>
                </div>
                <div style="margin: 16px 0; display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <div style="font-size: 11px; color: #94a3b8; font-family: var(--font-mono);">FRAUD RISK SCORE</div>
                    <div style="font-size: 38px; font-weight: 800; font-family: var(--font-mono); color: ${isF ? '#ef4444' : isS ? '#f59e0b' : '#10b981'};">
                      ${res.score}<span style="font-size: 16px; color: #64748b;">/100</span>
                    </div>
                    <div style="font-size: 12px; font-weight: bold; color: #fff;">${res.riskLevel}</div>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-size: 10px; color: #64748b; font-family: var(--font-mono);">PREDICTION</div>
                    <div style="font-size: 12px; font-weight: bold; color: #fff;">${res.prediction}</div>
                  </div>
                </div>
                <div style="background: rgba(15,23,42,0.8); padding: 10px; border-radius: 8px; font-size: 11px; color: #cbd5e1; border: 1px solid #1e293b;">
                  <strong>Reason:</strong> ${res.reason}
                </div>
                <div style="margin-top: 12px; font-size: 11px; color: #34d399; text-align: center;">
                  ✓ Successfully evaluated and added to surveillance stream.
                </div>
              </div>
            `;
          }
        };
      }

      // Presets
      document.querySelectorAll('.load-preset-btn').forEach(btn => {
        btn.onclick = () => {
          const type = btn.getAttribute('data-preset');
          if (type === 'safe') {
            document.getElementById('tx-amount').value = '45.00';
            document.getElementById('tx-location').value = 'New York, USA';
            document.getElementById('tx-frequency').value = 'Normal';
            document.getElementById('tx-history').value = 'None';
            document.getElementById('tx-age').value = '350';
          } else if (type === 'suspicious') {
            document.getElementById('tx-amount').value = '2400.00';
            document.getElementById('tx-location').value = 'London, UK';
            document.getElementById('tx-frequency').value = 'High';
            document.getElementById('tx-history').value = 'Suspected';
            document.getElementById('tx-age').value = '40';
          } else {
            document.getElementById('tx-amount').value = '9850.00';
            document.getElementById('tx-location').value = 'Moscow, RU';
            document.getElementById('tx-frequency').value = 'Extreme Burst';
            document.getElementById('tx-history').value = 'Confirmed Flag';
            document.getElementById('tx-age').value = '4';
          }
        };
      });

      // Settings sliders
      const slider = document.getElementById('thresh-slider');
      if (slider) {
        slider.oninput = (e) => {
          document.getElementById('thresh-val').innerText = e.target.value;
          state.settings.fraudThreshold = Number(e.target.value);
          saveState();
        };
      }
      const intervalSelect = document.getElementById('interval-select');
      if (intervalSelect) {
        intervalSelect.onchange = (e) => {
          state.settings.simulationInterval = Number(e.target.value);
          saveState();
        };
      }
      const audioToggle = document.getElementById('audio-toggle');
      if (audioToggle) {
        audioToggle.onchange = (e) => {
          state.settings.audioAlerts = e.target.checked;
          saveState();
        };
      }
      const resetSeedBtn = document.getElementById('reset-seed-btn');
      if (resetSeedBtn) {
        resetSeedBtn.onclick = () => {
          state.transactions = DEFAULT_TRANSACTIONS;
          state.alerts = DEFAULT_ALERTS;
          saveState();
          alert('Default seed data restored.');
          renderApp();
        };
      }
      const purgeDataBtn = document.getElementById('purge-data-btn');
      if (purgeDataBtn) {
        purgeDataBtn.onclick = () => {
          localStorage.clear();
          state.transactions = [];
          state.alerts = [];
          alert('All localStorage data cleared.');
          renderApp();
        };
      }

      // Modal Close
      const closeModalBtn = document.getElementById('close-modal-btn');
      const modalOkBtn = document.getElementById('modal-ok-btn');
      if (closeModalBtn) closeModalBtn.onclick = () => { state.selectedTx = null; renderApp(); };
      if (modalOkBtn) modalOkBtn.onclick = () => { state.selectedTx = null; renderApp(); };
    }

    // Radar Canvas Animation
    function initRadar() {
      const canvas = document.getElementById('radar-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let angle = 0;

      function draw() {
        const w = canvas.width, h = canvas.height;
        const cx = w / 2, cy = h / 2, r = w / 2 - 4;
        ctx.clearRect(0, 0, w, h);

        // Concentric rings
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.25)';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.arc(cx, cy, (r / 3) * i, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Crosshairs
        ctx.beginPath();
        ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
        ctx.stroke();

        // Sweeping gradient
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, angle, angle + 0.4);
        ctx.closePath();
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        grad.addColorStop(0, 'rgba(6, 182, 212, 0)');
        grad.addColorStop(1, 'rgba(6, 182, 212, 0.35)');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        // Target blips
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(cx + 35, cy - 20, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(cx - 25, cy + 30, 2.5, 0, Math.PI * 2);
        ctx.fill();

        angle += 0.04;
        if (angle >= Math.PI * 2) angle = 0;
        requestAnimationFrame(draw);
      }
      draw();
    }

    // Launch
    renderApp();
  </script>
</body>
